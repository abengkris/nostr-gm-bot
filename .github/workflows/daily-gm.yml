name: Daily GM Bot

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: # So you can "Run" manually

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          npm config set @jsr:registry=https://npm.jsr.io
          npm install

      - name: Run Bot
        env:
          NOSTR_SK: ${{ secrets.NOSTR_SK }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node bot.mjs